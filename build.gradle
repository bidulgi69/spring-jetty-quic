plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.3'
}

group = 'kr.bidulgi69'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation 'org.springframework.boot:spring-boot-starter-jetty'

    // quic
    testImplementation 'org.eclipse.jetty.quic:jetty-quic-server:12.0.16'
    implementation 'org.eclipse.jetty.http3:jetty-http3-server:12.0.16'
    implementation 'org.eclipse.jetty:jetty-alpn-server:12.0.16'
    implementation 'org.eclipse.jetty:jetty-alpn-conscrypt-server:12.0.16'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

jar {
    enabled = false
}